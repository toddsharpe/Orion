name: Package Extension

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    # The extension lives in a subfolder; run every `run:` step there.
    defaults:
      run:
        working-directory: Tools/vscode-orion

    # Needed for the release step to create a release + upload the .vsix on a tag.
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 20

    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    # Publish the language server into the extension's server/ folder so vsce bundles it in the .vsix.
    # Framework-dependent: launched via `dotnet Orion.LangSvr.dll`, so the user needs the .NET runtime.
    - name: Publish language server
      run: dotnet publish ../../Src/Orion.LangSvr -c Release -p:SatelliteResourceLanguages=en -p:DebugType=none -o ./server

    # Install client deps (vscode-languageclient runtime + typescript for the compile in vscode:prepublish).
    - name: Install client dependencies
      run: npm install

    # On a tag the tag IS the version, so the .vsix cannot ship a stale one from package.json.
    - name: Take the version from the tag
      if: startsWith(github.ref, 'refs/tags/')
      run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

    # Bundles: compiled out/ (via vscode:prepublish), server/, and production node_modules.
    - name: Package extension
      run: npx --yes @vscode/vsce package

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v7
      with:
        name: vscode-extension
        path: Tools/vscode-orion/*.vsix
        if-no-files-found: error

    # On a tag push (e.g. v0.1.0), publish the .vsix as a GitHub Release asset.
    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" --title "Orion $GITHUB_REF_NAME" --generate-notes || true
        gh release upload "$GITHUB_REF_NAME" *.vsix --clobber
